[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-audiobook"
version = "0.1.0"
description = "Zamiana ksiazek (PDF/MOBI/EPUB) na audiobooka glosem lektora"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
elevenlabs = ["requests>=2.31"]
xtts = ["coqui-tts>=0.24"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pdf-audiobook = "pdf_audiobook.cli:main"

[tool.setuptools]
packages = ["pdf_audiobook"]
